<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NU Media Club - รายการอุปกรณ์ที่กำลังถูกยืม" />
  <title>NU Media Club - รายการอุปกรณ์ที่กำลังถูกยืม</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'Noto Sans Thai', 'sans-serif'] },
          colors: {
            brand: { 50:'#fff7ed',100:'#ffedd5',200:'#fed7aa',300:'#fdba74',400:'#fb923c',500:'#f97316',600:'#ea580c',700:'#c2410c',800:'#9a3412',900:'#7c2d12' }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Config & API Helper (Cache Buster) -->
  <script src="config.js?v=3"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', 'Noto Sans Thai', sans-serif; background: #f9fafb; min-height: 100vh; }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 1.25rem;
      overflow: hidden;
      transition: box-shadow .2s ease, transform .2s ease;
    }
    .card:hover { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); transform: translateY(-3px); }

    .img-placeholder {
      background: #f3f4f6;
      display: flex; align-items: center; justify-content: center;
    }

    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.4} }
    .badge-dot { animation: pulse-dot 2s infinite; }

    @keyframes shimmer { 0%{ background-position: -200% 0; } 100%{ background-position: 200% 0; } }
    .skeleton {
      background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 1.25rem;
    }

    /* ═══ Image Carousel ═══ */
    .carousel-wrap { position: relative; overflow: hidden; }
    .carousel-track {
      display: flex;
      transition: transform .35s cubic-bezier(.4,0,.2,1);
    }
    .carousel-track img {
      width: 100%; height: 12rem; object-fit: cover; flex-shrink: 0;
      cursor: pointer;
      transition: opacity .15s;
    }
    .carousel-track img:hover { opacity: .92; }

    .carousel-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px;
      background: rgba(255,255,255,.85); backdrop-filter: blur(4px);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 5;
      opacity: 0; transition: opacity .2s, background .15s;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    .carousel-wrap:hover .carousel-btn { opacity: 1; }
    .carousel-btn:hover { background: #fff; }
    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }
    .carousel-btn svg { width: 16px; height: 16px; color: #374151; }

    .carousel-dots {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 5px; z-index: 5;
    }
    .carousel-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,.5);
      border: 1px solid rgba(0,0,0,.1);
      transition: background .2s, transform .2s;
      cursor: pointer;
    }
    .carousel-dots span.active {
      background: #fff;
      transform: scale(1.25);
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }

    .carousel-counter {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
      color: #fff; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 999px; z-index: 5;
    }
  </style>
</head>

<body class="text-gray-800 antialiased">

  <!-- ═══════════════ HEADER (ORANGE NAVBAR) ═══════════════ -->
  <header class="sticky top-0 z-50 bg-[#f97316] text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="icon.png" alt="Logo" class="w-10 h-10 object-contain shrink-0" onerror="this.style.display='none'" />
        <div>
          <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white">NU Media Club</h1>
          <p class="text-xs sm:text-sm text-orange-100 font-medium -mt-0.5">รายการอุปกรณ์ที่กำลังถูกยืม</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Counter Badge -->
        <div id="counterBadge" class="hidden items-center gap-2 bg-white/20 backdrop-blur-md rounded-full px-3 sm:px-4 py-1.5 border border-white/30 text-white">
          <span class="w-2 h-2 rounded-full bg-white badge-dot"></span>
          <span id="itemCount" class="text-sm sm:text-base font-bold text-white">0</span>
          <span class="text-xs sm:text-sm text-orange-100 font-medium">รายการ</span>
        </div>

        <!-- Header Return Button -->
         <!--
        <a
          href="return.html"
          class="bg-white text-[#ea580c] hover:bg-orange-50 font-bold text-xs sm:text-sm px-3.5 sm:px-4 py-2 rounded-xl shadow-sm transition-all flex items-center gap-1.5 cursor-pointer no-underline"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
          </svg>
          <span class="hidden sm:inline">ไปหน้า</span>คืนอุปกรณ์
        </a>
        -->
      </div>
    </div>
  </header>

  <!-- ═══════════════ SEARCH BAR ═══════════════ -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 pt-6 pb-2">
    <div class="relative">
      <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input
        id="searchInput"
        type="text"
        placeholder="ค้นหาด้วยชื่อเล่น, ฝ่าย หรือชื่ออุปกรณ์..."
        class="w-full pl-12 pr-4 py-3.5 rounded-xl bg-white border border-gray-200 text-base text-gray-800 placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#f97316] focus:border-[#f97316] transition-all"
      />
    </div>
  </div>

  <!-- ═══════════════ GRID ═══════════════ -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
    <div id="skeletonGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <div class="skeleton h-80"></div><div class="skeleton h-80"></div><div class="skeleton h-80"></div><div class="skeleton h-80"></div>
    </div>

    <div id="emptyState" class="hidden text-center py-20 bg-white border border-gray-200 rounded-2xl p-8">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-orange-50 flex items-center justify-center">
        <svg class="w-8 h-8 text-[#f97316]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
      </div>
      <p class="text-gray-700 text-xl font-bold">ไม่มีรายการอุปกรณ์ที่กำลังถูกยืม</p>
      <p class="text-gray-400 text-sm mt-1">อุปกรณ์ทุกชิ้นอยู่ในห้องเรียบร้อยแล้ว 🎉</p>
    </div>

    <div id="cardsGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <!-- ═══════════════ FLOATING BORROW BUTTON (FAB) ═══════════════ -->
  <a
    href="https://forms.gle/2cxGopfs4huoeoRE6"
    target="_blank"
    rel="noopener noreferrer"
    class="fixed bottom-6 right-6 z-50 flex items-center gap-2.5 bg-[#f97316] hover:bg-[#ea580c] text-white px-5 py-3.5 sm:px-6 sm:py-4 rounded-2xl shadow-xl hover:shadow-2xl font-bold text-sm sm:text-base transition-all duration-200 hover:scale-105 active:scale-95 no-underline border border-orange-400/40"
    title="กรอกฟอร์มยืมอุปกรณ์"
  >
    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
    </svg>
    <span>ยืมอุปกรณ์</span>
  </a>

  <!-- ═══════════════ IMAGE MODAL (multi-image) ═══════════════ -->
  <div id="imgModal" class="hidden fixed inset-0 z-[999] bg-black/70 flex items-center justify-center p-4 cursor-pointer" onclick="closeImgModal()">
    <!-- Prev button -->
    <button id="imgModalPrev" class="hidden absolute left-4 sm:left-8 top-1/2 -translate-y-1/2 z-[1000] w-11 h-11 rounded-full bg-white/90 backdrop-blur-md shadow-lg flex items-center justify-center hover:bg-white transition-all" onclick="modalNav(-1,event)" aria-label="รูปก่อนหน้า">
      <svg class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <!-- Image -->
    <img id="imgModalSrc" src="" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl" onclick="event.stopPropagation()" />
    <!-- Next button -->
    <button id="imgModalNext" class="hidden absolute right-4 sm:right-8 top-1/2 -translate-y-1/2 z-[1000] w-11 h-11 rounded-full bg-white/90 backdrop-blur-md shadow-lg flex items-center justify-center hover:bg-white transition-all" onclick="modalNav(1,event)" aria-label="รูปถัดไป">
      <svg class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>
    <!-- Counter -->
    <div id="imgModalCounter" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-[1000] bg-black/60 backdrop-blur-md text-white text-sm font-bold px-4 py-1.5 rounded-full"></div>
  </div>

<script>
  var allItems = [];

  function statusBadge(status) {
    var map = {
      'กำลังยืม':    { bg: 'bg-emerald-50 border-emerald-300', text: 'text-emerald-700', dot: 'bg-emerald-500' },
      'ถึงกำหนดคืน': { bg: 'bg-amber-50 border-amber-300',   text: 'text-amber-700',   dot: 'bg-amber-500' },
      'เลยกำหนดคืน': { bg: 'bg-red-50 border-red-300',       text: 'text-red-700',     dot: 'bg-red-500' }
    };
    var s = map[status] || map['กำลังยืม'];
    return '<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold border whitespace-nowrap shrink-0 ' + s.bg + ' ' + s.text + '">' +
           '<span class="w-2 h-2 rounded-full ' + s.dot + ' badge-dot shrink-0"></span>' + escHtml(status) + '</span>';
  }

  var _carouselId = 0;

  function buildCard(item) {
    var urls = item.imageUrls || [];
    // backward compat: if old API still sends imageUrl as string
    if (urls.length === 0 && item.imageUrl && item.imageUrl.trim()) {
      urls = [item.imageUrl.trim()];
    }
    var hasImages = urls.length > 0;
    var cid = _carouselId++;
    var imgHtml;

    if (!hasImages) {
      imgHtml = fallbackImg();
    } else if (urls.length === 1) {
      // Single image — no carousel needed
      imgHtml = '<div class="carousel-wrap">' +
        '<img src="' + escHtml(urls[0]) + '" alt="รูปอุปกรณ์" class="w-full" style="height:12rem;object-fit:cover;cursor:pointer" onclick="openImgModal([&quot;' + urls.map(escHtml).join('&quot;,&quot;') + '&quot;],0)" onerror="this.parentElement.innerHTML=fallbackImg()" />' +
      '</div>';
    } else {
      // Multiple images — carousel
      var imgsStr = urls.map(function(u, idx) {
        return '<img src="' + escHtml(u) + '" alt="รูปอุปกรณ์ ' + (idx+1) + '" onclick="openImgModal([&quot;' + urls.map(escHtml).join('&quot;,&quot;') + '&quot;],' + idx + ')" onerror="this.style.display=\'none\'" />';
      }).join('');

      var dotsStr = urls.map(function(_, idx) {
        return '<span onclick="goSlide(' + cid + ',' + idx + ')" class="' + (idx === 0 ? 'active' : '') + '"></span>';
      }).join('');

      imgHtml = '<div class="carousel-wrap" id="cw' + cid + '">' +
        '<div class="carousel-track" id="ct' + cid + '">' + imgsStr + '</div>' +
        '<button class="carousel-btn prev" onclick="slideCarousel(' + cid + ',-1)" aria-label="ก่อนหน้า">' +
          '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>' +
        '</button>' +
        '<button class="carousel-btn next" onclick="slideCarousel(' + cid + ',1)" aria-label="ถัดไป">' +
          '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>' +
        '</button>' +
        '<div class="carousel-dots" id="cd' + cid + '">' + dotsStr + '</div>' +
        '<div class="carousel-counter">' + '1/' + urls.length + '</div>' +
      '</div>';
    }

    return '<div class="card shadow-sm">' +
        '<div class="overflow-hidden bg-gray-100">' + imgHtml + '</div>' +
        '<div class="p-5 space-y-4">' +
          '<div class="flex items-start justify-between gap-3">' +
            '<div class="min-w-0 flex-1">' +
              '<h3 class="text-xl font-bold text-gray-900 leading-tight truncate">' + escHtml(item.nickname) + '</h3>' +
              '<p class="text-xs font-bold text-[#ea580c] mt-0.5 truncate">' + escHtml(item.department) + '</p>' +
            '</div>' +
            statusBadge(item.status) +
          '</div>' +
          '<div class="bg-orange-50/70 border border-orange-100 rounded-xl p-3.5">' +
            '<p class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1">อุปกรณ์ที่ยืม</p>' +
            '<p class="text-base font-bold text-gray-900 leading-relaxed">' + escHtml(item.items) + '</p>' +
          '</div>' +
          '<div class="flex items-center justify-between text-xs font-medium text-gray-500 pt-2 border-t border-gray-100">' +
            '<span>📅 ยืม: <strong class="text-gray-800 font-semibold">' + escHtml(item.borrowDate) + '</strong></span>' +
            '<span>⏰ คืน: <strong class="text-gray-800 font-semibold">' + escHtml(item.dueDate) + '</strong></span>' +
          '</div>' +
        '</div></div>';
  }

  // ── Carousel state tracking ──
  var _carouselStates = {};

  function slideCarousel(cid, dir) {
    var track = document.getElementById('ct' + cid);
    if (!track) return;
    var total = track.children.length;
    if (total <= 1) return;
    var cur = _carouselStates[cid] || 0;
    cur = (cur + dir + total) % total;
    _carouselStates[cid] = cur;
    track.style.transform = 'translateX(-' + (cur * 100) + '%)';
    updateDots(cid, cur, total);
  }

  function goSlide(cid, idx) {
    var track = document.getElementById('ct' + cid);
    if (!track) return;
    var total = track.children.length;
    _carouselStates[cid] = idx;
    track.style.transform = 'translateX(-' + (idx * 100) + '%)';
    updateDots(cid, idx, total);
  }

  function updateDots(cid, cur, total) {
    var dots = document.getElementById('cd' + cid);
    if (!dots) return;
    for (var i = 0; i < dots.children.length; i++) {
      dots.children[i].classList.toggle('active', i === cur);
    }
    // Update counter
    var wrap = document.getElementById('cw' + cid);
    if (wrap) {
      var counter = wrap.querySelector('.carousel-counter');
      if (counter) counter.textContent = (cur + 1) + '/' + total;
    }
  }

  function fallbackImg() {
    return '<div class="img-placeholder w-full" style="height:12rem">' +
      '<svg class="w-14 h-14 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">' +
        '<path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>' +
      '</svg></div>';
  }

  // ── Modal with multi-image navigation ──
  var _modalUrls = [];
  var _modalIdx = 0;

  function openImgModal(urls, idx) {
    if (typeof urls === 'string') { urls = [urls]; idx = 0; }
    _modalUrls = urls;
    _modalIdx = idx || 0;
    showModalImage();
    document.getElementById('imgModal').classList.remove('hidden');
  }

  function showModalImage() {
    document.getElementById('imgModalSrc').src = _modalUrls[_modalIdx];
    var counterEl = document.getElementById('imgModalCounter');
    var prevBtn = document.getElementById('imgModalPrev');
    var nextBtn = document.getElementById('imgModalNext');
    if (_modalUrls.length > 1) {
      counterEl.textContent = (_modalIdx + 1) + ' / ' + _modalUrls.length;
      counterEl.classList.remove('hidden');
      prevBtn.classList.remove('hidden');
      nextBtn.classList.remove('hidden');
    } else {
      counterEl.classList.add('hidden');
      prevBtn.classList.add('hidden');
      nextBtn.classList.add('hidden');
    }
  }

  function modalNav(dir, e) {
    if (e) e.stopPropagation();
    _modalIdx = (_modalIdx + dir + _modalUrls.length) % _modalUrls.length;
    showModalImage();
  }

  function closeImgModal() {
    document.getElementById('imgModal').classList.add('hidden');
    document.getElementById('imgModalSrc').src = '';
  }

  // ═══ Render & Search ═══
  function renderCards(items) {
    _carouselId = 0;
    _carouselStates = {};
    var grid  = document.getElementById('cardsGrid');
    var empty = document.getElementById('emptyState');
    var skel  = document.getElementById('skeletonGrid');

    skel.classList.add('hidden');

    if (items.length === 0) {
      grid.classList.add('hidden');
      empty.classList.remove('hidden');
    } else {
      empty.classList.add('hidden');
      grid.classList.remove('hidden');
      grid.innerHTML = items.map(buildCard).join('');
    }

    document.getElementById('itemCount').textContent = items.length;
    document.getElementById('counterBadge').classList.toggle('hidden', items.length === 0);
    document.getElementById('counterBadge').classList.toggle('flex', items.length > 0);
  }

  document.getElementById('searchInput').addEventListener('input', function() {
    var q = this.value.toLowerCase().trim();
    if (!q) { renderCards(allItems); return; }
    var filtered = allItems.filter(function(i) {
      return (i.nickname || '').toLowerCase().indexOf(q) !== -1 ||
             (i.department || '').toLowerCase().indexOf(q) !== -1 ||
             (i.items || '').toLowerCase().indexOf(q) !== -1;
    });
    renderCards(filtered);
  });

  function escHtml(str) {
    if (!str) return '';
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Load Data via REST API
  async function loadData() {
    try {
      const res = await apiGet('getPublicBorrowList');
      if (res.success) {
        allItems = res.data || [];
        renderCards(allItems);
      } else {
        throw new Error(res.message || 'ไม่สามารถดึงข้อมูลได้');
      }
    } catch (err) {
      document.getElementById('skeletonGrid').classList.add('hidden');
      Swal.fire({
        icon: 'error',
        title: 'โหลดข้อมูลไม่สำเร็จ',
        text: 'กรุณาตรวจสอบการตั้งค่า API_URL ในไฟล์ config.js หรือการเชื่อมต่ออินเทอร์เน็ต'
      });
    }
  }

  loadData();
</script>

</body>
</html>
